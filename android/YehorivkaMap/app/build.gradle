plugins {
    id 'com.android.application'
}

android {
    namespace 'com.squadmind.yehorivkamap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.squadmind.yehorivkamap'
        minSdk 26
        targetSdk 35
        versionCode 38
        versionName '0.34.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
